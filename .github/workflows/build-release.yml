name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor (leave empty if flavors are not configured)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use pinned Flutter SDK via FVM
        run: |
          fvm install
          fvm use $(cat .fvmrc | grep -o '"flutter":[[:space:]]*"[^"]*"' | cut -d'"' -f4) || fvm use

      - name: Write signing config
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=/home/viemed/upload-keystore.jks
          EOF

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Run analyzer
        run: fvm flutter analyze
        continue-on-error: true

      - name: Run tests
        run: fvm flutter test
        continue-on-error: true

      - name: Build release APK
        run: |
          if [ -n "${{ github.event.inputs.flavor }}" ]; then
            fvm flutter build apk --release --flavor ${{ github.event.inputs.flavor }} -t lib/main.dart
          else
            fvm flutter build apk --release
          fi

      - name: Prepare APK for release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/*.apk release/app-release.apk

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Release APK ${{ github.run_number }}
          files: release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Clean up signing config
        if: always()
        run: rm -f android/key.properties

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
