name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (leave empty if flavors are not configured)'
        required: false
        default: ''

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use pinned Flutter SDK via FVM
        run: |
          fvm install
          fvm use $(cat .fvmrc | grep -o '"flutter":[[:space:]]*"[^"]*"' | cut -d'"' -f4) || fvm use

      - name: Bump build number and create tag
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          # Extract semantic version (X.Y.Z) from pubspec.yaml
          SEMVER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$SEMVER" ]; then
            echo "ERROR: could not parse version from pubspec.yaml"
            exit 1
          fi
          echo "Semantic version from pubspec.yaml: $SEMVER"

          # Find highest existing build number among tags like v1.0.1+N
          LAST_BUILD=$(git tag -l "v${SEMVER}+*" | sed -E "s/v${SEMVER}\+//" | sort -n | tail -1)
          if [ -z "$LAST_BUILD" ]; then
            NEXT_BUILD=1
          else
            NEXT_BUILD=$((LAST_BUILD + 1))
          fi

          NEW_VERSION="${SEMVER}+${NEXT_BUILD}"
          NEW_TAG="v${NEW_VERSION}"
          echo "Last build number found: ${LAST_BUILD:-none}"
          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          # Update pubspec.yaml
          sed -i -E "s/^version:.*/version: ${NEW_VERSION}/" pubspec.yaml

          # Commit the version bump
          git config user.name "CI Bot"
          git config user.email "ci-bot@micromerger.local"
          if ! git diff --quiet pubspec.yaml; then
            git add pubspec.yaml
            git commit -m "chore: bump version to ${NEW_VERSION}"
            git push origin HEAD:main
          fi

          # Create and push the tag
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - name: Write signing config
        # Keystore file itself should already live on this VM outside the repo,
        # e.g. /home/viemed/upload-keystore.jks — never commit it.
        # Store the passwords as GitHub Actions secrets (Settings > Secrets > Actions).
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=/home/viemed/upload-keystore.jks
          EOF

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Run analyzer
        run: fvm flutter analyze
        continue-on-error: true

      - name: Run tests
        run: fvm flutter test
        continue-on-error: true

      - name: Build release APK
        run: |
          if [ -n "${{ github.event.inputs.flavor }}" ]; then
            fvm flutter build apk --release --flavor ${{ github.event.inputs.flavor }} -t lib/main.dart
          else
            fvm flutter build apk --release
          fi

      - name: Clean up signing config
        if: always()
        run: rm -f android/key.properties

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ env.NEW_TAG }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.NEW_TAG }}
          body: |
            Automated release build.
            Version: ${{ env.NEW_VERSION }}
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
