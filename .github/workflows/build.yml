name: Flutter CI/CD with Semantic Release

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: false
        default: ''

jobs:
  #############################################
  # JOB 1 — Test
  #############################################
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Flutter via FVM
        run: |
          fvm install
          fvm use $(cat .fvmrc | grep -o '"flutter":[[:space:]]*"[^"]*"' | \
            cut -d'"' -f4) || fvm use

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Run analyzer
        run: fvm flutter analyze
        continue-on-error: true

      - name: Run tests
        run: fvm flutter test
        continue-on-error: true

  #############################################
  # JOB 2 — Semantic Release
  # Only runs on push to main/develop/staging
  # NOT on pull_request events
  #############################################
  release:
    needs: test
    runs-on: self-hosted
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/staging'
      )
    # IMPORTANT: default GITHUB_TOKEN is often read-only depending on repo/org
    # settings. semantic-release/git and semantic-release/github both need
    # write access to push commits/tags and create releases.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.semantic.outputs.new_release_version }}
      new_tag: v${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm ci

      # cycjimmy/semantic-release-action wraps semantic-release and exposes
      # clean, typed outputs (new_release_published / new_release_version)
      # instead of us grepping stdout, which breaks silently on prerelease
      # branches and hides real failures behind `|| true`.
      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "CI Bot"
          GIT_AUTHOR_EMAIL: "ci-bot@micromerger.local"
          GIT_COMMITTER_NAME: "CI Bot"
          GIT_COMMITTER_EMAIL: "ci-bot@micromerger.local"

      - name: Debug outputs
        if: always()
        run: |
          echo "released=${{ steps.semantic.outputs.new_release_published }}"
          echo "version=${{ steps.semantic.outputs.new_release_version }}"

  #############################################
  # JOB 3 — Build APK
  # Only runs when semantic-release created
  # a new release
  #############################################
  build:
    needs: [test, release]
    runs-on: self-hosted
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Use Flutter via FVM
        run: |
          fvm install
          fvm use $(cat .fvmrc | grep -o '"flutter":[[:space:]]*"[^"]*"' | \
            cut -d'"' -f4) || fvm use

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | \
            sed -E 's/version:[[:space:]]*//')
          SEMVER=$(echo $VERSION | cut -d'+' -f1)
          BUILD=$(echo $VERSION | cut -d'+' -f2)
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "semver=$SEMVER"     >> $GITHUB_OUTPUT
          echo "build=$BUILD"       >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"      >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"     >> $GITHUB_OUTPUT
          echo "Version: $VERSION on branch: $BRANCH"

      - name: Write signing config
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=/home/viemed/upload-keystore.jks
          EOF

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Build release APK
        run: |
          if [ -n "${{ github.event.inputs.flavor }}" ]; then
            fvm flutter build apk \
              --release \
              --flavor ${{ github.event.inputs.flavor }} \
              -t lib/main.dart \
              --build-name=${{ steps.version.outputs.semver }} \
              --build-number=${{ steps.version.outputs.build }}
          else
            fvm flutter build apk \
              --release \
              --build-name=${{ steps.version.outputs.semver }} \
              --build-number=${{ steps.version.outputs.build }}
          fi

      - name: Build release AAB
        run: |
          fvm flutter build appbundle \
            --release \
            --build-name=${{ steps.version.outputs.semver }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Clean up signing config
        if: always()
        run: rm -f android/key.properties

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.tag }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ steps.version.outputs.tag }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.branch }})"
          body_path: CHANGELOG.md
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
